name: Mobile internal-test APK build (manual, approval-gated)

# Builds installable, release-mode Patient and Doctor Android APKs for
# controlled real-device testing against the existing production backend
# (https://api.hellodoctor.asia) -- never for Google Play publication. Never
# auto-triggered: dispatched manually only, so it never runs with secrets on
# untrusted code via push/PR.
#
# Secrets this workflow reads (none of which this workflow ever prints,
# commits, or derives a value from in log output):
#   - ANDROID_INTERNAL_TEST_KEYSTORE_BASE64 (required, build fails closed if
#     absent): base64 of a dedicated internal-testing .jks keystore -- NEVER
#     a production/Play Store signing key. apps/*/android/app/build.gradle.kts's
#     internalTestKeystoreProperties block itself falls back to the Flutter
#     debug keystore when no properties file is supplied (so a bare local
#     `flutter run --release` still works), but THIS workflow deliberately
#     never relies on that fallback -- see the "fail closed" step below.
#   - ANDROID_INTERNAL_TEST_KEYSTORE_PASSWORD (required alongside the above)
#   - ANDROID_INTERNAL_TEST_KEY_ALIAS (required alongside the above)
#   - GOOGLE_SERVICES_JSON_DOCTOR (required for any build that selects the
#     Doctor app): base64 of apps/mobile/android/app/google-services.json,
#     the real Firebase Android client config for the afyamkononi-ec314
#     project's com.example.hellodoctor_mobile app registration. These
#     builds exist specifically for real-device FCM end-to-end testing, so a
#     missing Firebase config now fails the build closed rather than quietly
#     producing a push-notification-dead APK.
#   - GOOGLE_SERVICES_JSON_PATIENT (required for any build that selects the
#     Patient app): same, for apps/mobile_patient's com.hellodoctor.patient
#     Firebase app registration.
# This workflow never reads, needs, or accepts any Firebase *server-side*
# service-account credential (FCM_PROJECT_ID/FCM_CLIENT_EMAIL/
# FCM_PRIVATE_KEY_B64) -- those stay exactly where they already are, on the
# Azure backend, and are never copied here.
#
# Matrix construction: workflow_dispatch's `build_patient`/`build_doctor`
# booleans are NOT usable as a job-level `if: matrix.app == ...` condition --
# the `matrix` context only exists inside the job that declares
# `strategy.matrix`, not at that job's own `if:` (which evaluates before the
# matrix is expanded). The `prepare` job below instead computes the actual
# list of apps to build as JSON from the two inputs, and `build` consumes it
# via `fromJSON(needs.prepare.outputs.matrix)` -- the documented way to build
# a dynamic matrix from upstream job output. Selecting neither app yields an
# empty `include` list and `has_apps=false`, so `build` is skipped entirely
# rather than running with a degenerate matrix.

on:
  workflow_dispatch:
    inputs:
      build_patient:
        description: Build the Patient APK
        type: boolean
        default: true
      build_doctor:
        description: Build the Doctor APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-test-apk-build
  cancel-in-progress: false

env:
  # Public certificate identity of the dedicated internal-testing keystore --
  # NOT a secret. A certificate's SHA-256 fingerprint is meant to be shared
  # (it's the same kind of value apps publish to restrict API keys by
  # signing cert), and it is already implicitly disclosed by this same
  # workflow's own `apksigner verify --print-certs` artifact. Recording the
  # expected value here lets the build verify it actually re-signed with
  # THIS known key, not merely that *some* valid signature exists -- rotate
  # this value (via a reviewed PR) if the internal-test keystore is ever
  # reissued.
  EXPECTED_INTERNAL_TEST_CERT_SHA256: "84:AE:C1:7D:CD:AB:33:B1:DC:F4:D7:21:A5:48:C3:F6:AE:41:A4:36:C0:A9:8A:08:99:88:6A:F5:FF:AB:53:A7"

jobs:
  prepare:
    name: Determine which apps to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
      - name: Build the app matrix from workflow_dispatch inputs
        id: set-matrix
        env:
          BUILD_PATIENT: ${{ inputs.build_patient }}
          BUILD_DOCTOR: ${{ inputs.build_doctor }}
        run: |
          set -euo pipefail
          entries=()
          if [ "${BUILD_PATIENT}" = "true" ]; then
            entries+=('{"app":"mobile_patient","label":"Patient","google_services_secret":"GOOGLE_SERVICES_JSON_PATIENT","output_name":"afyamkononi-patient-test.apk"}')
          fi
          if [ "${BUILD_DOCTOR}" = "true" ]; then
            entries+=('{"app":"mobile","label":"Doctor","google_services_secret":"GOOGLE_SERVICES_JSON_DOCTOR","output_name":"afyamkononi-doctor-test.apk"}')
          fi

          if [ "${#entries[@]}" -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${entries[*]}")
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report selection
        run: |
          echo "Patient selected: ${{ inputs.build_patient }}"
          echo "Doctor selected: ${{ inputs.build_doctor }}"
          echo "Computed matrix: ${{ steps.set-matrix.outputs.matrix }}"

  build:
    name: Build ${{ matrix.label }} internal-test APK
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Record checked-out application revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Decode Firebase Android client config (required -- these builds are for real FCM E2E testing)
        working-directory: apps/${{ matrix.app }}/android/app
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets[matrix.google_services_secret] }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64}" ]; then
            echo "::error::${{ matrix.google_services_secret }} is not set -- refusing to produce an internal-test APK without real Firebase configuration, since these builds exist specifically to verify FCM push delivery end-to-end."
            exit 1
          fi
          echo "${GOOGLE_SERVICES_JSON_B64}" | base64 -d > google-services.json
          echo "Firebase client config present for this build."

      - name: Decode internal-testing release keystore (required for a real, installable signature)
        working-directory: apps/${{ matrix.app }}/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_INTERNAL_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_INTERNAL_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_INTERNAL_TEST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Fail closed: an internal-test-signed APK was explicitly requested,
          # so a missing keystore must stop the build rather than silently
          # fall back to the publicly-known Flutter debug key (which the
          # build.gradle.kts signingConfig would otherwise do for any OTHER
          # caller, e.g. a bare local `flutter run --release` -- that
          # fallback stays in place for that case, but this workflow must
          # never rely on it).
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "::error::ANDROID_INTERNAL_TEST_KEYSTORE_BASE64/_PASSWORD/_KEY_ALIAS must all be set -- refusing to produce a debug-signed build for an internal-test APK request."
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 -d > internal-test.jks
          cat > internal-test-keystore.properties <<EOF
          storeFile=internal-test.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEYSTORE_PASSWORD}
          EOF

      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze

      - name: flutter test
        working-directory: apps/${{ matrix.app }}
        run: flutter test

      - name: Build release APK (production backend, no development bypasses)
        working-directory: apps/${{ matrix.app }}
        # ARM64-only, split-per-abi: this is for initial physical-device E2E
        # testing, where every target phone is arm64-v8a, not for a
        # universal/multi-ABI distribution -- --target-platform android-arm64
        # also skips building the unused armeabi-v7a/x86_64 native slices
        # entirely, rather than just discarding them after the fact.
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=API_BASE_URL=https://api.hellodoctor.asia/api/v1 \
            --dart-define=ENVIRONMENT=production

      - name: Rename, verify signature, and checksum
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/dist/${{ matrix.output_name }}"
          cd "$GITHUB_WORKSPACE/dist"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "${{ matrix.output_name }}" | tee signing-info.txt
          "$BUILD_TOOLS/aapt2" dump badging "${{ matrix.output_name }}" | head -5 | tee -a signing-info.txt
          sha256sum "${{ matrix.output_name }}" | tee "${{ matrix.output_name }}.sha256"

      - name: Verify signing certificate identity (not just that a valid signature exists)
        working-directory: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          actual=$(grep -i "SHA-256 digest" signing-info.txt | head -1 | grep -oE '[0-9a-fA-F:]{32,}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(echo "${EXPECTED_INTERNAL_TEST_CERT_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "${actual}" ]; then
            echo "::error::Could not extract a SHA-256 certificate digest from apksigner's output -- refusing to trust an unverified signature."
            exit 1
          fi
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::${{ matrix.label }} APK is signed by an unexpected certificate -- it was not signed with the known internal-test key. This can mean the ANDROID_INTERNAL_TEST_KEYSTORE_BASE64 secret was rotated without updating EXPECTED_INTERNAL_TEST_CERT_SHA256, or a wrong/unexpected keystore was used."
            exit 1
          fi
          echo "Signing certificate identity verified against the expected internal-test key."

      - name: Clean up decoded keystore/Firebase config before upload (never bundled as an artifact)
        if: always()
        working-directory: apps/${{ matrix.app }}/android/app
        run: rm -f internal-test.jks internal-test-keystore.properties google-services.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.label }}-test-apk-${{ steps.rev.outputs.sha }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.sha256
            dist/signing-info.txt
          retention-days: 14
