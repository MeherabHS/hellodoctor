name: GHCR existing-private-package GITHUB_TOKEN canary (manual, diagnostic only)

# DIAGNOSTIC ONLY - prepared for review, not for routine use. This is Stage 2
# of the private-GHCR-bootstrap plan, and it exists to answer one further
# question before arm64-ghcr-publish.yml is ever granted write access to a
# real HelloDoctor package: once a package has been manually bootstrapped as
# PRIVATE via a classic PAT (Stage 1, done entirely outside of GitHub
# Actions), does a SUBSEQUENT push to that SAME, already-existing package via
# this repository's GITHUB_TOKEN change its visibility back to public?
#
# This matters because GitHub's own documentation is internally inconsistent
# on this exact point:
#   - The access-control docs say a linked repository's visibility is NOT
#     inherited by the package.
#   - The GitHub Actions docs say a GITHUB_TOKEN-created package DOES inherit
#     the source repository's visibility.
#   - Neither page states what happens to visibility on a push to a package
#     that already exists (as opposed to being created by that push).
# This gap must not be assumed away - it is tested here, empirically, before
# any real HelloDoctor image is ever published this way.
#
# This workflow:
#   - Publishes ONLY a second harmless, inline-generated dummy image tag (same
#     alpine-based pattern as the original visibility canary) - no
#     HelloDoctor source, configuration, credentials, or data of any kind.
#     The Dockerfile is generated by this workflow's own `run:` step; nothing
#     is COPYed from the checked-out tree, and the repository is not checked
#     out at all.
#   - Pushes into PACKAGE_NAME below, which MUST be a disposable test package
#     that was already manually bootstrapped as private via a classic PAT
#     (Stage 1) and already had this repository granted "Write" access under
#     the package's own Settings -> "Manage Actions access". This workflow
#     does not create the package and does not grant itself access - both are
#     manual prerequisites, verified by this workflow failing closed if they
#     are not already in place (the push step will simply fail with a
#     permission error if access was not granted).
#   - Is NEVER pointed at any of the four real HelloDoctor package names
#     (hellodoctor-backend, hellodoctor-admin-web, hellodoctor-doctor-web,
#     hellodoctor-postgres-pgbackrest). PACKAGE_NAME below is a disposable
#     test name only.
#   - Uses the exact same auth mechanism (GITHUB_TOKEN via `docker login`),
#     repository context, and protected `arm64-ghcr-publish` environment as
#     the real publisher, so the answer this produces actually transfers to
#     it - this is the same parity rationale as the original canary.
#   - Scopes `packages: write` to only this one job; the top-level default
#     stays `contents: read`.
#   - Never touches, modifies, or weakens arm64-ghcr-publish.yml itself, and
#     never touches the original arm64-ghcr-visibility-canary.yml - this is a
#     wholly separate, additional file.
#   - Does NOT delete the test package or its tags afterward.
#   - Compares the visibility/pull result against what Stage 1 already
#     recorded for the same package, and fails loudly (non-zero exit, clearly
#     marked in the job summary) if anything changed for the worse.
#
# PREREQUISITES (all manual, all outside this workflow):
#   1. This file must be on the repository's default branch before it can be
#      dispatched at all - a standing condition of workflow_dispatch, not a
#      one-time bootstrap step.
#   2. PACKAGE_NAME must already exist as a PRIVATE package, created via a
#      classic PAT push from a local machine (never via GITHUB_TOKEN) - this
#      is Stage 1 of the bootstrap plan.
#   3. PACKAGE_NAME's own Settings -> "Manage Actions access" must already
#      list this repository with "Write" role - otherwise the push step below
#      fails with a permission error (fails closed, does not silently
#      succeed against the wrong package or fall back to creating a new one).
#   4. The `arm64-ghcr-publish` environment's required-reviewer protection
#      must already exist (confirmed separately via the environments API).
#
# DO NOT DISPATCH without separate, explicit authorization. This file being
# merged to the default branch makes it visible and dispatchable in the
# Actions UI; it does not run anything by itself.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type EXACTLY "run-existing-package-canary" to confirm you intend to dispatch this diagnostic
        required: true
        type: string
      package_name:
        description: The disposable test package name already bootstrapped as private in Stage 1 (must NOT be a real HelloDoctor image name)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arm64-ghcr-existing-package-token-canary
  cancel-in-progress: false

jobs:
  publish-second-tag:
    name: Push a second GITHUB_TOKEN-authored tag into an existing private package and re-verify
    if: ${{ inputs.confirm == 'run-existing-package-canary' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: arm64-ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Reject if confirmation phrase does not match exactly
        if: ${{ inputs.confirm != 'run-existing-package-canary' }}
        run: |
          echo "::error::confirm input must be exactly 'run-existing-package-canary' - refusing to proceed."
          exit 1

      - name: Reject if package_name looks like one of the four real HelloDoctor images
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          case "$PACKAGE_NAME" in
            hellodoctor-backend|hellodoctor-admin-web|hellodoctor-doctor-web|hellodoctor-postgres-pgbackrest)
              echo "::error::package_name must be a disposable test package, not a real HelloDoctor image name. Refusing to proceed."
              exit 1
              ;;
          esac

      - name: Compute lowercase GHCR owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify native ARM64 runner (parity with the real publisher)
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(docker info --format '{{.Architecture}}')" = aarch64

      - name: Generate a second harmless, inline, repository-independent dummy Dockerfile
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-build-2
          cat > /tmp/canary-build-2/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN echo "stage-2 github-token canary - diagnostic image, no application content" > /canary.txt
          CMD ["cat", "/canary.txt"]
          EOF
          cat /tmp/canary-build-2/Dockerfile

      - name: Log in to GHCR with the scoped workflow token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push a second tag into the existing package by digest
        id: push
        env:
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          tag="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}:github-token-canary-${{ github.run_id }}"
          docker buildx build --platform linux/arm64 \
            --tag "$tag" --push \
            --metadata-file /tmp/canary-metadata-2.json \
            /tmp/canary-build-2
          digest="$(python3 -c "import json; print(json.load(open('/tmp/canary-metadata-2.json'))['containerimage.digest'])")"
          ref="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}@${digest}"
          {
            echo "CANARY2_IMAGE=${ref}"
            echo "CANARY2_TAG=${tag}"
          } >> "$GITHUB_ENV"
          echo "CANARY2_IMAGE=${ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify visibility is STILL private via authenticated API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          response="$(gh api "/users/${OWNER_LC}/packages/container/${PACKAGE_NAME}")"
          echo "$response" | python3 -m json.tool
          visibility="$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('visibility'))")"
          repo_link="$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('repository') or {}; print(r.get('full_name'))")"
          {
            echo "RESULT: visibility=${visibility} repository_link=${repo_link}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "CANARY2_VISIBILITY=${visibility}" >> "$GITHUB_ENV"
          echo "CANARY2_REPO_LINK=${repo_link}" >> "$GITHUB_ENV"

      - name: Verify an ANONYMOUS, unauthenticated client is STILL denied
        env:
          CANARY2_TAG: ${{ env.CANARY2_TAG }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          if docker pull "$CANARY2_TAG"; then
            echo "RESULT: ANONYMOUS PULL SUCCEEDED - visibility regressed to public after a GITHUB_TOKEN push to an existing package." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "CANARY2_ANONYMOUS_PULL=succeeded" >> "$GITHUB_ENV"
          else
            echo "RESULT: anonymous pull was refused - the package remained private after the GITHUB_TOKEN push." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "CANARY2_ANONYMOUS_PULL=refused" >> "$GITHUB_ENV"
          fi

      - name: Summarize findings and the required decision on real-package bootstrap
        run: |
          set -euo pipefail
          {
            echo "## GHCR existing-private-package GITHUB_TOKEN canary result"
            echo ""
            echo "- Package: \`${{ inputs.package_name }}\`"
            echo "- Reported visibility after GITHUB_TOKEN push (API): \`${CANARY2_VISIBILITY:-unknown}\`"
            echo "- Linked repository: \`${CANARY2_REPO_LINK:-none}\`"
            echo "- Anonymous pull after GITHUB_TOKEN push: \`${CANARY2_ANONYMOUS_PULL:-unknown}\`"
            echo ""
            if [ "${CANARY2_VISIBILITY:-}" = "public" ] || [ "${CANARY2_ANONYMOUS_PULL:-}" = "succeeded" ]; then
              echo "CONCLUSION: a GITHUB_TOKEN push to an ALREADY-EXISTING private package CAN"
              echo "regress its visibility to public. DO NOT grant arm64-ghcr-publish.yml write"
              echo "access to the four real HelloDoctor packages under this architecture without"
              echo "further mitigation - the PAT-bootstrap approach alone is not sufficient."
            else
              echo "CONCLUSION: a GITHUB_TOKEN push to an already-existing private package"
              echo "preserved its private visibility and anonymous pulls remained denied."
              echo "This supports proceeding with Stage B of the real bootstrap (the four real"
              echo "HelloDoctor packages), subject to separate explicit authorization, and"
              echo "subject to re-verifying each real package independently after its own first"
              echo "real GITHUB_TOKEN push - do not generalize this one disposable-package result"
              echo "to all four without that per-package check."
            fi
            echo ""
            echo "REMINDER: this test package was NOT deleted and now has a second test tag."
            echo "Clean up manually (Settings -> Packages, or the packages API) once this result"
            echo "has been recorded."
          } | tee -a "$GITHUB_STEP_SUMMARY"
