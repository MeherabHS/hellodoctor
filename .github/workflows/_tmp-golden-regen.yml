name: TEMPORARY golden regen (Care) -- deleted after use

on:
  push:
    branches: [tmp/golden-regen-20261115]

permissions:
  contents: read


jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Regenerate goldens for the two affected test files only
        run: |
          flutter test --update-goldens \
            test/notification_center_page_test.dart \
            test/qna_rendering_test.dart

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # NOTE: upload-artifact's `path` is resolved relative to
        # GITHUB_WORKSPACE (repo root), NOT this job's `defaults.run.
        # working-directory` -- that default only applies to `run:` steps.
        with:
          name: regenerated-doctor-goldens
          path: |
            apps/mobile/test/goldens/notifications-loading.png
            apps/mobile/test/goldens/notifications-empty.png
            apps/mobile/test/goldens/notifications-error.png
            apps/mobile/test/goldens/notifications-populated.png
            apps/mobile/test/goldens/qna-editor-keyboard.png
            apps/mobile/test/goldens/qna-unanswered.png
            apps/mobile/test/goldens/qna-long-question.png
            apps/mobile/test/goldens/qna-answered.png
            apps/mobile/test/goldens/qna-loading.png
            apps/mobile/test/goldens/qna-empty.png
            apps/mobile/test/goldens/qna-error.png
            apps/mobile/test/goldens/qna-offline-cache.png
          retention-days: 3
          if-no-files-found: error
