name: Backend migration integrity

# Proves the one invariant B-01 (docs/DOCTOR_SYSTEM_FINAL_MULTI_AGENT_AUDIT.md
# §3) showed was never actually checked anywhere: that every migration in
# services/backend/migrations applies cleanly, in order, against a genuinely
# fresh PostgreSQL 16 instance, and that the resulting schema is one the
# backend can actually serve real requests against. `cargo test --test
# api_tests` already proves this on every run via `#[sqlx::test(migrations =
# "./migrations")]` (each test gets its own freshly-migrated throwaway
# database) — this workflow is what makes that guarantee a CI gate instead of
# something only visible when a developer happens to run the suite locally.

on:
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - ".github/workflows/backend-migrations.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/backend/**"
      - ".github/workflows/backend-migrations.yml"

permissions:
  contents: read

jobs:
  migrate-and-test:
    name: Apply migrations to a fresh Postgres and run the backend test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches services/backend/docker-compose.yml exactly, so this job
        # exercises the same version/credentials shape local dev does.
        image: postgres:16
        env:
          POSTGRES_USER: hellodoctor
          POSTGRES_PASSWORD: hellodoctor_dev_password
          POSTGRES_DB: hellodoctor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hellodoctor -d hellodoctor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        # Host-mapped to a non-default port deliberately: tests/api_tests.rs's
        # own `is_disposable_redis_endpoint` safety check refuses to run any
        # Redis-touching test against the default port 6379, specifically so
        # a misconfigured TEST_REDIS_URL can never point at a real shared
        # Redis instance. The container's internal port (used by the
        # redis-cli health check below) is unaffected.
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `#[sqlx::test]` connects with this as the superuser/template
      # connection it uses to create a fresh throwaway database per test (and
      # to run `ALTER ROLE` against the cluster-wide capability roles) — it
      # is not a real backend runtime config, just what the test harness
      # needs. See tests/api_tests.rs's own `test_config()` doc comments for
      # why nothing else from .env.example is required here.
      DATABASE_URL: postgres://hellodoctor:hellodoctor_dev_password@localhost:5432/hellodoctor
      # Required by tests/api_tests.rs's `test_redis_url()`/`reset_owned_redis`:
      # Redis-backed tests refuse to run against anything that isn't an
      # explicitly owned, non-default-port fixture (see the comment on the
      # service above). TEST_REDIS_FIXTURE_ID must start with
      # "final-remediation-" — `reset_owned_redis`'s own hardcoded prefix
      # check — and is written as this fixture's ownership marker below
      # before any test runs.
      TEST_REDIS_URL: redis://127.0.0.1:16380/0
      TEST_REDIS_FIXTURE_ID: final-remediation-ci

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-17
        with:
          toolchain: stable
          components: clippy

      - name: cargo fmt --check
        working-directory: services/backend
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        # CLAUDE.md documents this as the project's lint gate, but nothing
        # in CI actually ran it before this — a plain cargo build/test only
        # ever treats lint-level issues (including the rust_2024_compatibility
        # lints that would have caught this session's dropped-Result-value
        # bugs) as non-fatal warnings, so a regression of that exact class
        # could land without CI ever noticing.
        working-directory: services/backend
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test --lib (unit tests, no database)
        # --locked: fails closed if this resolves a dependency graph that
        # differs from the committed Cargo.lock, instead of silently
        # re-resolving — the same lockfile cargo-audit scans in
        # security-scan.yml (fixes h18-cargo-audit-unaudited-drift).
        working-directory: services/backend
        run: cargo test --lib --locked

      - name: Bootstrap the disposable test-Redis fixture ownership marker
        # One-time safety handshake `reset_owned_redis` requires before it
        # will ever FLUSHDB this fixture — see the comment on the Redis
        # service above. Never touches the real dev Redis (there isn't one
        # in this job).
        run: |
          sudo apt-get update -y && sudo apt-get install -y redis-tools
          redis-cli -h 127.0.0.1 -p 16380 SET hd:test-fixture:owner "final-remediation-ci"

      - name: cargo test --test api_tests (every migration applied fresh, real HTTP against it)
        working-directory: services/backend
        # Single-threaded — see the warning comment at the top of
        # tests/api_tests.rs: the five capability roles are cluster-wide
        # Postgres objects, so parallel test threads race on shared
        # pg_authid catalog rows across the one Postgres service container.
        run: cargo test --test api_tests --locked -- --test-threads=1
