name: GHCR visibility canary (manual, diagnostic only)

# DIAGNOSTIC ONLY - prepared for review, not for routine use. This workflow
# exists to answer one question before arm64-ghcr-publish.yml is ever
# dispatched against this public repository: does a brand-new GHCR container
# package, published via this repository's GITHUB_TOKEN, default to public or
# private visibility? Current GitHub documentation disagrees with itself on
# this point (GHCR's own docs say new packages are private by default;
# GitHub Actions docs describe repository-visibility inheritance for
# workflow-published packages) - this cannot be resolved by reading docs
# alone, and must not be assumed either way for a healthcare application.
#
# This workflow:
#   - Publishes ONLY a harmless, inline-generated dummy image (alpine base
#     plus one echoed string) - no HelloDoctor source, configuration,
#     credentials, or data of any kind. The Dockerfile is generated by this
#     workflow's own `run:` step into a scratch directory; nothing is COPYed
#     from the checked-out repository tree, and the repository is not even
#     checked out.
#   - Publishes under a package name (hellodoctor-ghcr-visibility-canary)
#     that cannot collide with any real HelloDoctor image name
#     (hellodoctor-backend, hellodoctor-admin-web, hellodoctor-doctor-web,
#     hellodoctor-postgres-pgbackrest).
#   - Uses the exact same auth mechanism (GITHUB_TOKEN via `docker login`),
#     repository context, and protected `arm64-ghcr-publish` environment as
#     the real publisher, so the answer this produces actually transfers to
#     it.
#   - Scopes `packages: write` to only this one job; the top-level default
#     stays `contents: read`.
#   - Never touches, modifies, or weakens arm64-ghcr-publish.yml itself -
#     this is a wholly separate file.
#   - Does NOT delete the test package afterward. Deleting a package is its
#     own separate, irreversible action and is left as a deliberate manual
#     follow-up once this workflow's result has been recorded.
#
# PREREQUISITES (same standing conditions as arm64-ghcr-publish.yml):
#   1. This file must be on the repository's default branch before it can be
#      dispatched at all - GitHub's docs state plainly that workflow_dispatch
#      requires the workflow file to be on the default branch, as a standing
#      condition, not a one-time bootstrap step.
#   2. The `arm64-ghcr-publish` environment's required-reviewer protection
#      must already exist (confirmed separately via the environments API:
#      required_reviewers rule, reviewer MeherabHS) - this workflow does not
#      create or verify that configuration itself.
#
# DO NOT DISPATCH without separate, explicit authorization. This file being
# merged to the default branch makes it visible and dispatchable in the
# Actions UI; it does not run anything by itself.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type EXACTLY "run-canary" to confirm you intend to dispatch this diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arm64-ghcr-visibility-canary
  cancel-in-progress: false

jobs:
  publish-canary:
    name: Publish dummy canary image and verify its visibility
    if: ${{ inputs.confirm == 'run-canary' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: arm64-ghcr-publish
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: hellodoctor-ghcr-visibility-canary
    steps:
      - name: Reject if confirmation phrase does not match exactly
        if: ${{ inputs.confirm != 'run-canary' }}
        run: |
          echo "::error::confirm input must be exactly 'run-canary' - refusing to proceed."
          exit 1

      - name: Compute lowercase GHCR owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify native ARM64 runner (parity with the real publisher)
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(docker info --format '{{.Architecture}}')" = aarch64

      - name: Generate a harmless, inline, repository-independent dummy Dockerfile
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-build
          cat > /tmp/canary-build/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN echo "hellodoctor-ghcr-visibility-canary - diagnostic image, no application content" > /canary.txt
          CMD ["cat", "/canary.txt"]
          EOF
          cat /tmp/canary-build/Dockerfile

      - name: Log in to GHCR with the scoped workflow token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the canary image by digest
        env:
          OWNER_LC: ${{ steps.owner.outputs.lc }}
        run: |
          set -euo pipefail
          tag="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}:canary-${{ github.run_id }}"
          docker buildx build --platform linux/arm64 \
            --tag "$tag" --push \
            --metadata-file /tmp/canary-metadata.json \
            /tmp/canary-build
          digest="$(python3 -c "import json; print(json.load(open('/tmp/canary-metadata.json'))['containerimage.digest'])")"
          ref="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}@${digest}"
          {
            echo "CANARY_IMAGE=${ref}"
            echo "CANARY_TAG=${tag}"
          } >> "$GITHUB_ENV"
          echo "CANARY_IMAGE=${ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify actual visibility via authenticated API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_LC: ${{ steps.owner.outputs.lc }}
        run: |
          set -euo pipefail
          response="$(gh api "/users/${OWNER_LC}/packages/container/${PACKAGE_NAME}")"
          echo "$response" | python3 -m json.tool
          visibility="$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin).get('visibility'))")"
          repo_link="$(printf '%s' "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('repository') or {}; print(r.get('full_name'))")"
          {
            echo "RESULT: visibility=${visibility} repository_link=${repo_link}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "CANARY_VISIBILITY=${visibility}" >> "$GITHUB_ENV"
          echo "CANARY_REPO_LINK=${repo_link}" >> "$GITHUB_ENV"

      - name: Verify whether an ANONYMOUS, unauthenticated client can pull it
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          # A fresh, credential-less pull is the ground-truth test - package
          # metadata can say one thing while actual registry enforcement says
          # another; this is the test that actually matters for real risk.
          if docker pull "$CANARY_TAG"; then
            echo "RESULT: ANONYMOUS PULL SUCCEEDED - this image is reachable without any credential." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ANONYMOUS_PULL=succeeded" >> "$GITHUB_ENV"
          else
            echo "RESULT: anonymous pull was refused - this image required authentication." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ANONYMOUS_PULL=refused" >> "$GITHUB_ENV"
          fi

      - name: Summarize findings and the required action on arm64-ghcr-publish.yml
        run: |
          set -euo pipefail
          {
            echo "## GHCR visibility canary result"
            echo ""
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- Reported visibility (API): \`${CANARY_VISIBILITY:-unknown}\`"
            echo "- Linked repository: \`${CANARY_REPO_LINK:-none}\`"
            echo "- Anonymous pull: \`${ANONYMOUS_PULL:-unknown}\`"
            echo ""
            if [ "${CANARY_VISIBILITY:-}" = "public" ] || [ "${ANONYMOUS_PULL:-}" = "succeeded" ]; then
              echo "CONCLUSION: new packages published by this workflow/repository default to PUBLIC."
              echo "arm64-ghcr-publish.yml MUST be amended to explicitly force each package to"
              echo "private BEFORE or atomically with its first push - not merely check visibility"
              echo "after the fact - before it is dispatched again."
            else
              echo "CONCLUSION: new packages published by this workflow/repository default to"
              echo "PRIVATE, despite the repository itself being public."
              echo "arm64-ghcr-publish.yml's existing check-after-push step is consistent with"
              echo "this result, though an explicit force-private step remains reasonable"
              echo "defense-in-depth for a healthcare application."
            fi
            echo ""
            echo "REMINDER: this test package (${PACKAGE_NAME}) is NOT deleted by this workflow."
            echo "Delete it manually (Settings -> Packages, or the packages API) once this"
            echo "result has been recorded."
          } | tee -a "$GITHUB_STEP_SUMMARY"
