name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly-disclosed advisories against dependencies that haven't
    # changed — cargo-audit's DB updates independently of our commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-17
        with:
          toolchain: stable

      - name: Install cargo-audit (prebuilt binary, not compiled from source)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: cargo audit
        # Scans the committed services/backend/Cargo.lock directly — the
        # same lockfile `cargo test`/`cargo clippy` use below and in
        # backend-migrations.yml (fixes h18-cargo-audit-unaudited-drift: no
        # more throwaway job-local lockfile that the test job never sees).
        working-directory: services/backend
        # RUSTSEC-2023-0071 (rsa: Marvin Attack timing sidechannel, no fixed
        # upstream release) is ignored deliberately: it reaches Cargo.lock
        # only via sqlx's optional `mysql` feature (sqlx-mysql -> rsa), which
        # this backend does not enable (Cargo.toml only enables `postgres`).
        # Confirmed via `cargo tree -i rsa` returning zero matches — `rsa` is
        # not part of the actual compiled dependency graph. Verified
        # 2026-10-04; re-check if sqlx's `mysql` feature is ever enabled, or
        # if a fixed `rsa` release ships.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

  secret-scan:
    name: Secret scanning (git history + working tree)
    runs-on: ubuntu-latest
    # trufflehog's action needs a push/PR commit range to diff against; the
    # weekly cron re-run only makes sense for cargo-audit (whose advisory DB
    # updates independently of our commits), so skip this job on that trigger
    # rather than giving it a meaningless range.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2, not @main
        with:
          extra_args: --only-verified
