name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly-disclosed advisories against dependencies that haven't
    # changed — cargo-audit's DB updates independently of our commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-17
        with:
          toolchain: stable

      - name: Install cargo-audit (prebuilt binary, not compiled from source)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: cargo audit
        # Scans the committed services/backend/Cargo.lock directly — the
        # same lockfile `cargo test`/`cargo clippy` use below and in
        # backend-migrations.yml (fixes h18-cargo-audit-unaudited-drift: no
        # more throwaway job-local lockfile that the test job never sees).
        working-directory: services/backend
        # RUSTSEC-2023-0071 (rsa: Marvin Attack timing sidechannel, no fixed
        # upstream release) is ignored deliberately: it reaches Cargo.lock
        # only via sqlx's optional `mysql` feature (sqlx-mysql -> rsa), which
        # this backend does not enable (Cargo.toml only enables `postgres`).
        # Confirmed via `cargo tree -i rsa` returning zero matches — `rsa` is
        # not part of the actual compiled dependency graph. Verified
        # 2026-10-04; re-check if sqlx's `mysql` feature is ever enabled, or
        # if a fixed `rsa` release ships.
        #
        # RUSTSEC-2026-0459 (libsqlite3-sys via C SQLite CVE-2026-119375) is
        # ignored for the same reason and verified the same way: it reaches
        # Cargo.lock only via sqlx's optional `sqlite` feature (sqlx-sqlite ->
        # libsqlite3-sys), which this backend does not enable (Cargo.toml only
        # enables `postgres`; this is a PostgreSQL-only backend per
        # docs/SYSTEM_POLICY.md §1). Confirmed via `cargo tree -i libsqlite3-sys`
        # (and again with `--all-features`) returning zero matches — no
        # SQLite code is compiled into this binary, so there is no actual
        # exploitable surface here. sqlx-sqlite 0.8.6 itself pins
        # `libsqlite3-sys = "^0.30.1"`, which caps below the fixed 0.39.0 —
        # `cargo update -p libsqlite3-sys --precise 0.39.0` fails for exactly
        # this reason, confirming no newer compatible version can be locked
        # without an upstream sqlx-sqlite release even if we wanted one.
        # Verified 2026-11-11; re-check if sqlx's `sqlite` feature is ever
        # enabled, or once a sqlx-sqlite release ships that itself requires a
        # patched `libsqlite3-sys`.
        #
        # RUSTSEC-2026-0543 (chrono unmaintained) and RUSTSEC-2026-0542
        # (humantime unmaintained) are ignored by product-owner decision
        # (2026-11-22). They are informational "unmaintained" notices, not
        # vulnerabilities: no known flaw and nothing to upgrade to. chrono is
        # used directly by the backend and by sqlx-core/sqlx-postgres and
        # object_store; humantime arrives only via object_store. Neither can
        # be removed without replacing sqlx and the storage library. Re-check
        # when sqlx or object_store move off them, or if either notice is
        # upgraded to a vulnerability.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0543 --ignore RUSTSEC-2026-0542

  flutter-dependency-audit:
    name: Flutter dependency vulnerability scan (OSV-Scanner)
    # The reusable OSV workflow's job declares `actions: read`, `contents:
    # read` and `security-events: write`. A caller that grants less makes
    # GitHub refuse to start the WHOLE Security Scan run (startup_failure,
    # seen on every run on 2026-11-21), silently disabling cargo-audit and
    # secret scanning too. security-events: write stays unused while
    # upload-sarif is false.
    permissions:
      actions: read
      contents: read
      security-events: write
    # Scans the two committed Flutter pubspec.lock files (apps/mobile — the
    # Doctor app — and apps/mobile_patient — the Patient app) against the OSV
    # database. OSV-Scanner natively parses pubspec.lock for the Pub
    # ecosystem (verified locally: `osv-scanner --lockfile=apps/mobile/pubspec.lock
    # --lockfile=apps/mobile_patient/pubspec.lock` correctly enumerated 156
    # and 157 packages respectively). `--recursive ./` is deliberately not
    # used: the Rust lockfile is already covered by cargo-audit above, and a
    # repo-wide scan would also pick up Node lockfiles with no established
    # triage policy here. upload-sarif is off because this repo has not
    # enabled GitHub code scanning; fail-on-vuln is on so an actionable
    # advisory fails this job the same way cargo-audit fails on one. A
    # confirmed, currently-unfixable advisory would be excluded the same way
    # RUSTSEC-2023-0071 is above: with a dated, linked comment, not a silent
    # suppression.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
        --lockfile=apps/mobile_patient/pubspec.lock

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Semgrep (pinned)
        run: python -m pip install --disable-pip-version-check "semgrep==1.184.0"
      # Community rules for the languages we ship. Every finding is printed;
      # ERROR-severity findings fail the job. Tests, generated code and build
      # output are excluded. A deliberate exception is a `nosemgrep` comment
      # with the reason on the same line, never a blanket ignore.
      - name: semgrep scan
        run: >-
          semgrep scan --metrics=off --disable-version-check
          --config p/rust --config p/typescript --config p/react
          --config p/nextjs --config p/javascript --config p/dockerfile
          --config p/secrets --config p/github-actions
          --exclude 'services/backend/tests' --exclude '**/test/**' --exclude '**/tests/**'
          --exclude '**/node_modules/**' --exclude '**/.next/**' --exclude '**/build/**'
          --exclude 'apps/*/lib/l10n/app_localizations*.dart'
          --severity ERROR --error .

  trivy:
    name: Dependency, Dockerfile and config scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned by checksum, not by tag: Trivy's release tags were hijacked in
      # March 2026 (GHSA-69fq-xp46-6x23), so a tag alone proves nothing.
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Trivy (checksum-verified)
        run: |
          set -euo pipefail
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$file" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${file}"
          echo "${TRIVY_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      # Known vulnerabilities in every lockfile (Cargo, npm, pub) and
      # misconfigurations in the Dockerfiles, compose files and workflows.
      # HIGH and CRITICAL with a released fix fail the job; anything accepted
      # goes in .trivyignore with a reason and a review date.
      - name: trivy fs
        run: >-
          trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --ignorefile .trivyignore
          --skip-dirs services/backend/target --skip-dirs node_modules
          --skip-dirs apps/admin-web/node_modules --skip-dirs apps/doctor-web/node_modules
          .

  secret-scan:
    name: Secret scanning (git history + working tree)
    runs-on: ubuntu-latest
    # trufflehog's action needs a push/PR commit range to diff against; the
    # weekly cron re-run only makes sense for cargo-audit (whose advisory DB
    # updates independently of our commits), so skip this job on that trigger
    # rather than giving it a meaningless range.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2, not @main
        with:
          extra_args: --only-verified
