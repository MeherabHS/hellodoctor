services:
  postgres:
    image: postgres:16
    container_name: hellodoctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hellodoctor
      POSTGRES_PASSWORD: hellodoctor_dev_password
      POSTGRES_DB: hellodoctor
    ports:
      - "5432:5432"
    volumes:
      - hellodoctor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellodoctor -d hellodoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hellodoctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hellodoctor_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  hellodoctor_pgdata:
  hellodoctor_redisdata:
