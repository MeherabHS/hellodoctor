services:
  postgres:
    image: postgres:16
    container_name: hellodoctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hellodoctor
      POSTGRES_PASSWORD: hellodoctor_dev_password
      POSTGRES_DB: hellodoctor
    ports:
      - "5432:5432"
    volumes:
      - hellodoctor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellodoctor -d hellodoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hellodoctor_pgdata:
