[package]
name = "hellodoctor-backend"
version = "2.4.0"
edition = "2021"

[dependencies]
# Async Runtime & HTTP Server
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = { version = "0.4", features = ["timeout", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

# Serialization & Validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.18", features = ["derive"] }
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

# Security & Cryptography
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"

# Image Processing (Upload Security Pipeline)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Database & Migrations
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal", "migrate", "macros"] }

# MFA (admin TOTP) & encryption-at-rest for TOTP secrets
totp-rs = { version = "5.6", features = ["gen_secret"] }
aes-gcm = "0.10"

# Telemetry
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
dotenvy = "0.15"
futures-util = "0.3"
parking_lot = "0.12"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
