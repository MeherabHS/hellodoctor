[package]
name = "hellodoctor-backend"
version = "2.4.0"
edition = "2021"

[dependencies]
# Async Runtime & HTTP Server
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = { version = "0.4", features = ["timeout", "load-shed", "limit", "util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "limit", "catch-panic"] }

# Serialization & Validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

# Security & Cryptography
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
# Agora AccessToken2's required wire format (zlib-compressed signing payload,
# see services/agora_token_service.rs). Already present transitively via
# tower-http's compression-full feature — this just promotes it to a direct,
# version-pinned dependency rather than introducing new supply-chain surface.
flate2 = "1.1"

# Image Processing (Upload Security Pipeline)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "azure"] }

# Database & Migrations
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal", "migrate", "macros", "json"] }

# Encryption-at-rest for small secrets (payout/payment identifiers, etc.)
aes-gcm = "0.10"

# Telemetry
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Milestone 8 hold-duration investigation (2026-11-04): only needed as the
# parameter type for sqlx's own `PoolOptions::acquire_time_level`, which lets
# us capture its built-in "aquired_after_secs" tracing event (target
# "sqlx::pool::acquire") into a metric via a tracing_subscriber Layer, with
# zero call-site changes anywhere a pool is used. Already a transitive
# dependency of sqlx at this exact version; adding it directly changes
# nothing about what gets compiled.
log = "0.4"
thiserror = "1.0"
dotenvy = "0.15"
futures-util = "0.3"
parking_lot = "0.12"
async-trait = "0.1"
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1"] }
regex = "1.10"
# Keep the direct HTTP client on Rustls so the ARM64 image does not require
# an OpenSSL development toolchain. object_store still brings aws-lc-rs for
# its Azure/AWS TLS paths, which is built and checked for ARM64 in CI.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# No-echo terminal password prompt. Used by the `admin_bootstrap` binary
# (src/bin/admin_bootstrap.rs), which is shipped in the production image —
# a real (non-dev) dependency, unlike the dev-only examples/reset_admin_password.rs
# below, which still gets this same crate via [dev-dependencies].
rpassword = "7"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
