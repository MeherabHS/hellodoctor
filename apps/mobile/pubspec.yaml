name: hellodoctor_mobile
description: HelloDoctor Doctor mobile client
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  dio: ^5.6.0
  crypto: ^3.0.7
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  workmanager: 0.6.0
  agora_rtc_engine: ^6.6.3
  permission_handler: ^11.3.1
dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
